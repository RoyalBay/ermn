<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ermn. · Community</title>
<link rel="icon" href="wicon.png">
<style>
:root {
  --accent: #3b5998;
  --body-bg: linear-gradient(180deg,#dfe7f3 0%,#f5f6f7 100%);
  --card-bg: #fff; --topbar-bg: #3b5998;
  --text: #333; --border: #b0b7c3;
  --card-header: linear-gradient(180deg,#e8edf7,#d8e0f0);
  --input-bg: #fafafa;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:Tahoma,Verdana,sans-serif; background:var(--body-bg); color:var(--text); min-height:100vh; font-size:13px; }

.topbar { background:var(--topbar-bg); height:44px; display:flex; align-items:center; padding:0 12px; gap:10px; position:sticky; top:0; z-index:50; box-shadow:0 2px 5px rgba(0,0,0,0.3); border-bottom:2px solid rgba(0,0,0,0.2); }
.topbar-logo { font-size:22px; font-weight:bold; color:white; letter-spacing:-1px; font-style:italic; text-shadow:1px 1px 2px rgba(0,0,0,0.3); }
.topbar-nav { display:flex; gap:4px; margin-left:10px; }
.topbar-nav a { color:rgba(255,255,255,0.85); font-size:12px; text-decoration:none; padding:4px 8px; border-radius:2px; }
.topbar-nav a:hover, .topbar-nav a.active { background:rgba(255,255,255,0.15); color:white; }
.topbar-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
.topbar-right button { background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); padding:4px 10px; font-size:12px; cursor:pointer; font-family:inherit; }

.container { display:flex; max-width:1050px; margin:16px auto; gap:12px; padding:0 10px; }
.main-col { flex:1; min-width:0; }
.sidebar { width:300px; flex-shrink:0; }

.header-banner { background: #ddd; height: 150px; background-size: cover; background-position: center; position: relative; border: 1px solid var(--border); border-bottom: none; }
.header-info { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; position: relative; margin-bottom: 15px; }
.c-pic { width: 80px; height: 80px; border-radius: 6px; border: 3px solid white; position: absolute; top: -40px; background: #eee; }
.c-meta { margin-left: 95px; }
.c-name { font-size: 20px; font-weight: bold; color: var(--accent); margin-bottom: 5px; }
.c-desc { font-size: 13px; color: #555; margin-bottom: 10px; }
.c-stats { font-size: 12px; color: #888; display: flex; gap: 15px; align-items: center; }
.c-timer { color: #d9534f; font-weight: bold; }
.action-btns { margin-top: 15px; display: flex; gap: 10px; }
.action-btns button { padding: 6px 12px; cursor: pointer; font-family: inherit; font-weight: bold; }
.btn-leave { background: #f0f0f0; border: 1px solid #ccc; color: #333; }
.btn-primary { background: var(--accent); color: white; border: none; }
.btn-danger { background: #d9534f; color: white; border: none; }

.compose-box { background:var(--card-bg); border:1px solid var(--border); padding:10px; margin-bottom:10px; }
.compose-box textarea { width:100%; height:64px; resize:none; border:1px solid var(--border); padding:6px; font-family:inherit; font-size:13px; }
.compose-box button { background:var(--accent); color:white; border:none; padding:6px 14px; margin-top:6px; cursor:pointer; font-weight:bold; }

.post { background:var(--card-bg); border:1px solid var(--border); margin-bottom:8px; padding:10px; position: relative; }
.post-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.post-meta { flex:1; }
.user-link { color:var(--accent); font-weight:bold; text-decoration:none; }
.post-time { font-size:11px; color:#888; }
.post-text { padding:4px 0; word-break:break-word; }
.delete-post { position: absolute; top: 10px; right: 10px; color: #999; cursor: pointer; }
.delete-post:hover { color: #d9534f; }

.sidebar-card { background: var(--card-bg); border: 1px solid var(--border); margin-bottom: 10px; }
.sidebar-title { background: var(--card-header); padding: 8px 10px; font-weight: bold; border-bottom: 1px solid var(--border); }
.sidebar-body { padding: 10px; }
.member-list { max-height: 300px; overflow-y: auto; }
.member-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px dashed #eee; }
.member-item:last-child { border-bottom: none; }
.member-kick { color: #d9534f; cursor: pointer; font-size: 11px; }

/* Edit modal */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center; padding:10px; }
.modal { background:var(--card-bg); width:400px; max-width:100%; padding:20px; border-radius:6px; }
.modal label { display: block; margin-top: 10px; margin-bottom: 5px; font-weight: bold; font-size: 12px; }
.modal input, .modal textarea { width: 100%; padding: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 13px; margin-bottom: 5px; }
.modal .btn-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">ermn.</span>
  <nav class="topbar-nav">
    <a href="feed.html"><span class="material-icons">home</span> Home</a>
    <a href="communities.html" class="active"><span class="material-icons">groups</span> Communities</a>
    <a href="profile.html"><span class="material-icons">person</span> Profile</a>
  </nav>
  <div class="topbar-right">
    <button onclick="location.href='settings.html'"><span class="material-icons" style="font-size:14px;">settings</span> Settings</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">
  <div class="main-col">
    <div class="header-banner" id="c_banner"></div>
    <div class="header-info">
      <img class="c-pic" id="c_pic" src="empty.jpg">
      <div class="c-meta">
        <div class="c-name" id="c_name">Loading...</div>
        <div class="c-desc" id="c_desc">Loading description...</div>
        <div class="c-stats">
          <span><span class="material-icons" style="font-size:14px;vertical-align:middle;">person</span> <span id="c_creator"></span></span>
          <span class="c-timer"><span class="material-icons" style="font-size:14px;vertical-align:middle;">timer</span> <span id="c_time"></span></span>
        </div>
        <div class="action-btns" id="c_actions"></div>
      </div>
    </div>
    
    <div class="compose-box">
      <textarea id="postText" placeholder="Say something to the community..."></textarea>
      <div style="text-align:right;">
        <button onclick="submitPost()">Post</button>
      </div>
    </div>
    
    <div id="postsList"></div>
  </div>
  
  <div class="sidebar">
    <div class="sidebar-card">
      <div class="sidebar-title"><span class="material-icons" style="font-size:14px;vertical-align:middle;">people</span> Members (<span id="memberCount">0</span>)</div>
      <div class="sidebar-body member-list" id="memberList">Loading...</div>
    </div>
  </div>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>Edit Community</h3>
    <label>Description</label>
    <textarea id="edit_desc" rows="3"></textarea>
    <label>Profile Image URL</label>
    <input type="text" id="edit_pic">
    <label>Banner Image URL</label>
    <input type="text" id="edit_banner">
    
    <div class="btn-row">
      <button onclick="document.getElementById('editModal').style.display='none'">Cancel</button>
      <button onclick="saveEdit()" style="background:var(--accent);color:white;border:none;">Save</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const commId = urlParams.get('id');
if (!commId) location.href = "communities.html";

let communityData = null;
let isCreator = false;

document.addEventListener("sessionReady", () => {
  if (!currentUser) location.href = "index.html";
  loadCommunity();
});
if (typeof currentUser !== 'undefined' && currentUser) {
  document.dispatchEvent(new Event("sessionReady"));
}

async function loadCommunity() {
  const { data: c, error } = await sb.from("communities").select("*").eq("id", commId).single();
  if (error || !c) { alert("Community not found or expired."); location.href = "communities.html"; return; }
  
  // check if expired
  if (new Date(c.expires_at) < new Date()) {
    alert("This community has expired and is no longer available.");
    location.href = "communities.html";
    return;
  }
  
  communityData = c;
  isCreator = (c.creator === currentUser);
  
  document.getElementById('c_name').innerText = c.name;
  document.getElementById('c_desc').innerText = c.description || 'No description.';
  document.getElementById('c_creator').innerText = "Created by @" + c.creator;
  if (c.pic) document.getElementById('c_pic').src = c.pic;
  if (c.banner) document.getElementById('c_banner').style.backgroundImage = `url('${c.banner}')`;
  
  updateTimer();
  setInterval(updateTimer, 60000);
  
  // Actions
  let actionsHtml = `<button class="btn-leave" onclick="leaveCommunity()">Leave Community</button>`;
  if (isCreator) {
    actionsHtml += `<button class="btn-primary" onclick="openEdit()">Edit Settings</button>`;
    actionsHtml += `<button class="btn-danger" onclick="deleteCommunity()">Delete Early</button>`;
  }
  document.getElementById('c_actions').innerHTML = actionsHtml;
  
  loadMembers();
  loadPosts();
}

function updateTimer() {
  if (!communityData) return;
  const diff = new Date(communityData.expires_at) - new Date();
  if (diff <= 0) {
    document.getElementById('c_time').innerText = "Expired";
    return;
  }
  const hours = Math.floor(diff / (1000 * 60 * 60));
  const mins = Math.floor((diff / (1000 * 60)) % 60);
  document.getElementById('c_time').innerText = hours > 24 ? Math.floor(hours/24) + "d " + (hours%24) + "h remaining" : hours + "h " + mins + "m remaining";
}

async function loadMembers() {
  const { data } = await sb.from("community_members").select("username").eq("community_id", commId);
  const list = document.getElementById('memberList');
  document.getElementById('memberCount').innerText = data ? data.length : 0;
  
  if (!data) return;
  
  // Check if I am a member. If not, redirect out.
  const iAmMember = data.some(m => m.username === currentUser);
  if (!iAmMember) {
    alert("You are not a member of this community.");
    location.href = "communities.html";
    return;
  }
  
  list.innerHTML = "";
  data.forEach(m => {
    let kickHtml = "";
    if (isCreator && m.username !== currentUser) {
      kickHtml = `<span class="member-kick" onclick="kickMember('${m.username}')">Remove</span>`;
    }
    list.innerHTML += `
      <div class="member-item">
        <a href="userpage.html?user=${encodeURIComponent(m.username)}" class="user-link">@${escapeHtml(m.username)}</a>
        ${kickHtml}
      </div>
    `;
  });
}

async function kickMember(user) {
  if (!confirm(`Remove ${user} from community?`)) return;
  await sb.from("community_members").delete().eq("community_id", commId).eq("username", user);
  loadMembers();
}

async function leaveCommunity() {
  if (!confirm("Are you sure you want to leave?")) return;
  await sb.from("community_members").delete().eq("community_id", commId).eq("username", currentUser);
  location.href = "communities.html";
}

async function deleteCommunity() {
  if (!confirm("Are you sure you want to delete this community permanently?")) return;
  await sb.from("communities").delete().eq("id", commId);
  location.href = "communities.html";
}

function openEdit() {
  document.getElementById('edit_desc').value = communityData.description || '';
  document.getElementById('edit_pic').value = communityData.pic || '';
  document.getElementById('edit_banner').value = communityData.banner || '';
  document.getElementById('editModal').style.display = 'flex';
}

async function saveEdit() {
  const desc = document.getElementById('edit_desc').value.trim();
  const pic = document.getElementById('edit_pic').value.trim();
  const banner = document.getElementById('edit_banner').value.trim();
  
  await sb.from("communities").update({ description: desc, pic, banner }).eq("id", commId);
  document.getElementById('editModal').style.display = 'none';
  loadCommunity();
}

async function submitPost() {
  const t = document.getElementById('postText').value.trim();
  if (!t) return;
  await sb.from("community_posts").insert({ community_id: commId, username: currentUser, text: t });
  document.getElementById('postText').value = "";
  loadPosts();
}

async function loadPosts() {
  const { data } = await sb.from("community_posts").select("*").eq("community_id", commId).order("created_at", { ascending: false });
  const list = document.getElementById('postsList');
  if (!data || data.length === 0) {
    list.innerHTML = "<div style='text-align:center;padding:20px;color:#888;'>No posts yet.</div>";
    return;
  }
  
  list.innerHTML = "";
  data.forEach(p => {
    let delHtml = "";
    if (p.username === currentUser || isCreator) {
      delHtml = `<span class="delete-post" onclick="deletePost(${p.id})"><span class="material-icons" style="font-size:16px;">close</span></span>`;
    }
    
    list.innerHTML += `
      <div class="post">
        <div class="post-header">
          <div class="post-meta">
            <a href="userpage.html?user=${encodeURIComponent(p.username)}" class="user-link">@${escapeHtml(p.username)}</a>
            <div class="post-time">${new Date(p.created_at).toLocaleString()}</div>
          </div>
          ${delHtml}
        </div>
        <div class="post-text">${escapeHtml(p.text)}</div>
      </div>
    `;
  });
}

async function deletePost(pid) {
  if (!confirm("Delete post?")) return;
  await sb.from("community_posts").delete().eq("id", pid);
  loadPosts();
}

function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
